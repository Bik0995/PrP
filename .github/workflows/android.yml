name: Compiler PrP Android
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prp-android-source/prp-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: prp-android
          path: |
            prp-android-source/prp-android/app/build/outputs/apk/debug/app-debug.apk
            prp-android-source/prp-android/app/build/outputs/apk/release/app-release.apk
