name: Convertir le modèle Marqo
on:
  push:
    paths:
      - prp-android-source/prp-android/outils/convertir_marqo.py
      - .github/workflows/modele-marqo.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  onnx:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prp-android-source/prp-android/outils
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --quiet timm huggingface_hub safetensors onnx onnxscript onnxruntime numpy
      - run: python convertir_marqo.py
      - uses: actions/upload-artifact@v4
        with:
          name: modele-marqo
          path: |
            prp-android-source/prp-android/outils/marqo_nsfw_384.onnx
            prp-android-source/prp-android/outils/marqo_nsfw_384.json
      - name: Ajouter le modèle au dépôt
        run: |
          cp marqo_nsfw_384.onnx marqo_nsfw_384.json ../app/src/main/assets/
          cd ../../..
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add prp-android-source/prp-android/app/src/main/assets/marqo_nsfw_384.onnx prp-android-source/prp-android/app/src/main/assets/marqo_nsfw_384.json
          git diff --cached --quiet || (git commit -m "Modèle Marqo NSFW 384 (Apache 2.0) converti en ONNX" && git push)
